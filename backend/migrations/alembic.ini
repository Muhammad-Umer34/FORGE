# Alembic settings for FORGE (D-173). Run from the FORGE-1 root:
#   .venv\Scripts\python.exe -m alembic -c backend/migrations/alembic.ini upgrade head
# The database URL comes from .env (SUPABASE_DB_URL; add "-x db=test" for TEST_DATABASE_URL).
[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../..
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
